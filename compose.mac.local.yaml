name: ai-interview-mac
services:
  mysql:
    image: mysql:8.0.45
    platform: linux/arm64
    environment:
      MYSQL_DATABASE: ai_interview
      MYSQL_USER: ai_interview
      MYSQL_PASSWORD: ${AI_MYSQL_PASSWORD:?set AI_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${AI_MYSQL_ROOT_PASSWORD:?set AI_MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ai-mysql-data:/var/lib/mysql
      - ./sql/ai_interview.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
  milvus:
    profiles: [vector]
    image: milvusdb/milvus:v2.6.24
    platform: linux/arm64
    command: [milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - ai-milvus-data:/var/lib/milvus
    configs:
      - source: embed-etcd
        target: /milvus/configs/embedEtcd.yaml
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
volumes:
  ai-mysql-data:
  ai-milvus-data:
configs:
  embed-etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://127.0.0.1:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'
