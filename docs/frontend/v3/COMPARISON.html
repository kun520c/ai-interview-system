</style><header><span class="tag">REAL BROWSER CAPTURE · MOCK API</span><h1>Technical Interview Studio V3</h1><p>公开审查精选：16 张改版前截图与 24 张改版后截图。原始完整截图矩阵保存在本地交付归档；此页仅列仓库内精选。同名截图采用相同夹具和原始视口；补充状态仅有 V3 截图。所有成绩、记录和评价来自测试夹具，此页不代表真实后端 E2E。</p><label for="frame">页面与原始视口</label><select id="frame"></select></header><main><div class="pair"><figure><figcaption>Before · V2</figcaption><a id="before-link" target="_blank" rel="noopener"><img id="before" alt="改版前截图"></a><div id="missing" hidden>补充验证状态，没有对应的 V2 截图。</div></figure><figure class="after"><figcaption>After · V3</figcaption><a id="after-link" target="_blank" rel="noopener"><img id="after" alt="改版后截图"></a></figure></div><p>点击截图可查看原始尺寸。视口：1440×900 / 1024×768 / 390×844。详见 before/browser-log.json、after/browser-log.json，以及 V3 验证报告和源文件变更清单。</p></main><script>const frames=[{"file": "login-1440.png", "label": "登录 · 1440px", "before": true}, {"file": "dashboard-start-1440.png", "label": "工作台 · 开始 · 1440px", "before": true}, {"file": "create-1440.png", "label": "难度选择 · 1440px", "before": true}, {"file": "session-answering-1440.png", "label": "面试 · 作答 · 1440px", "before": true}, {"file": "session-evaluation-1440.png", "label": "面试 · 评价关卡 · 1440px", "before": true}, {"file": "session-followup-1440.png", "label": "面试 · 追问 · 1440px", "before": true}, {"file": "session-blocked-1440.png", "label": "面试 · 恢复受阻 · 1440px", "before": false}, {"file": "report-1440.png", "label": "报告 · 1440px", "before": true}, {"file": "admin-questions-1440.png", "label": "题库 · 1440px", "before": true}, {"file": "login-390.png", "label": "登录 · 390px", "before": true}, {"file": "dashboard-start-390.png", "label": "工作台 · 开始 · 390px", "before": true}, {"file": "create-390.png", "label": "难度选择 · 390px", "before": true}, {"file": "session-answering-390.png", "label": "面试 · 作答 · 390px", "before": true}, {"file": "session-evaluation-390.png", "label": "面试 · 评价关卡 · 390px", "before": true}, {"file": "session-followup-390.png", "label": "面试 · 追问 · 390px", "before": true}, {"file": "session-blocked-390.png", "label": "面试 · 恢复受阻 · 390px", "before": false}, {"file": "report-390.png", "label": "报告 · 390px", "before": true}, {"file": "mobile-menu-390.png", "label": "手机菜单 · 390px", "before": false}, {"file": "admin-questions-390.png", "label": "题库 · 390px", "before": true}, {"file": "difficulty-keyboard-focus-1440.png", "label": "难度 · 键盘焦点 · 1440px", "before": false}, {"file": "session-long-answer-1440.png", "label": "长文本作答 · 1440px", "before": false}, {"file": "difficulty-keyboard-focus-390.png", "label": "难度 · 键盘焦点 · 390px", "before": false}, {"file": "report-failed-390.png", "label": "报告 · 失败 · 390px", "before": false}, {"file": "session-long-answer-390.png", "label": "长文本作答 · 390px", "before": false}];const select=document.getElementById('frame');for(const frame of frames){const option=document.createElement('option');option.value=frame.file;option.textContent=frame.label;select.append(option)}function render(){const frame=frames.find(x=>x.file===select.value);for(const side of ['before','after']){const img=document.getElementById(side);const link=document.getElementById(side+'-link');const show=side==='after'||frame.before;link.hidden=!show;if(show){img.src=side+'/'+frame.file;img.alt=(side==='before'?'改版前':'改版后')+' · '+frame.label;link.href=img.src}}document.getElementById('missing').hidden=frame.before}select.value='session-answering-1440.png';select.addEventListener('change',render);render();</script></html>
