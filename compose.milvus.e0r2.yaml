name: ai-interview-e0r2
services:
  milvus:
    image: milvusdb/milvus:v2.6.26@sha256:f43e0cd0c9912c35379c349f7f3a3a806b9308462d43d1bfa18d007c6642d693
    platform: linux/arm64
    container_name: ai-interview-e0r2-milvus
    command: [milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:19532:19530"
      - "127.0.0.1:9093:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    configs:
      - source: embed-etcd
        target: /milvus/configs/embedEtcd.yaml
    mem_limit: 4g
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
volumes:
  milvus-data:
    name: ai-interview-e0r2-milvus-data
configs:
  embed-etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://127.0.0.1:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'
