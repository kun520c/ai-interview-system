spring:
  application:
    name: ai-interview-system

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  tomcat:
    max-swallow-size: 6MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  issuer: ai-interview-system
  access-token-expiration: 2h

embedding:
  base-url: ${EMBEDDING_BASE_URL}
  api-key: ${EMBEDDING_API_KEY}
  model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
  dimension: ${EMBEDDING_DIMENSION:1024}
  batch-size: ${EMBEDDING_BATCH_SIZE:20}
  profile-version: ${EMBEDDING_PROFILE_VERSION:qwen3.7-text-embedding-1024-dense-v1}
  connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:3s}
  read-timeout: ${EMBEDDING_READ_TIMEOUT:20s}

milvus:
  enabled: ${MILVUS_ENABLED:false}
  uri: ${MILVUS_URI:http://localhost:19530}
  token: ${MILVUS_TOKEN:}
  database-name: ${MILVUS_DATABASE_NAME:default}
  collection-name: ${MILVUS_COLLECTION_NAME:knowledge_chunk_vectors}
  dimension: ${MILVUS_DIMENSION:1024}
  connect-timeout: ${MILVUS_CONNECT_TIMEOUT:5s}
  request-timeout: ${MILVUS_REQUEST_TIMEOUT:10s}

recovery:
  evaluating-stale-threshold: ${RECOVERY_EVALUATING_STALE_THRESHOLD:10m}
  generating-stale-threshold: ${RECOVERY_GENERATING_STALE_THRESHOLD:10m}
  processing-stale-threshold: ${RECOVERY_PROCESSING_STALE_THRESHOLD:15m}

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
  connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:3s}
  read-timeout: ${DEEPSEEK_READ_TIMEOUT:60s}

# Migration and cutover require explicit per-target approval. No synchronous fallback.
report:
  async:
    enabled: ${REPORT_ASYNC_ENABLED:false}
    accepting: ${REPORT_ASYNC_ACCEPTING:true}
    wakeup-enabled: ${REPORT_ASYNC_WAKEUP_ENABLED:true}
    nameserver: ${REPORT_MQ_NAMESERVER:127.0.0.1:19876}
    topic: ${REPORT_MQ_TOPIC:ai-interview-report}
    consumer-group: ${REPORT_MQ_CONSUMER_GROUP:ai-interview-report-consumer}
    scan-batch-size: 16
    scan-interval-ms: ${REPORT_ASYNC_SCAN_INTERVAL_MS:500}
    send-timeout-ms: 5000
    dispatch-lease-seconds: 30
    max-send-attempts: 20
    queue-deadline-seconds: 600
    execution-deadline-seconds: 600
    consumer-threads: ${REPORT_ASYNC_CONSUMER_THREADS:4}
    max-reconsume-times: 5
    consumer-timeout-minutes: 12
