spring:
  application:
    name: ai-interview-system

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  issuer: ai-interview-system
  access-token-expiration: 2h

embedding:
  base-url: ${EMBEDDING_BASE_URL}
  api-key: ${EMBEDDING_API_KEY}
  model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
  dimension: ${EMBEDDING_DIMENSION:1024}
  batch-size: ${EMBEDDING_BATCH_SIZE:20}
  profile-version: ${EMBEDDING_PROFILE_VERSION:qwen3.7-text-embedding-1024-dense-v1}
  connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:3s}
  read-timeout: ${EMBEDDING_READ_TIMEOUT:20s}

milvus:
  enabled: ${MILVUS_ENABLED:false}
  uri: ${MILVUS_URI:http://localhost:19530}
  token: ${MILVUS_TOKEN:}
  database-name: ${MILVUS_DATABASE_NAME:default}
  collection-name: ${MILVUS_COLLECTION_NAME:knowledge_chunk_vectors}
  dimension: ${MILVUS_DIMENSION:1024}
  connect-timeout: ${MILVUS_CONNECT_TIMEOUT:5s}
  request-timeout: ${MILVUS_REQUEST_TIMEOUT:10s}