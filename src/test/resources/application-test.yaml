spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/ai_interview_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${TEST_DB_USERNAME:${DB_USERNAME}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  issuer: ai-interview-system-test
  access-token-expiration: 2h

embedding:
  base-url: http://localhost:18080/v1
  api-key: test-embedding-api-key
  model: qwen3.7-text-embedding
  dimension: 1024
  batch-size: 20
  profile-version: qwen3.7-text-embedding-1024-dense-v1
  connect-timeout: 3s
  read-timeout: 20s

milvus:
  enabled: false
  database-name: ${TEST_MILVUS_DATABASE_NAME:default}
  collection-name: ${TEST_MILVUS_COLLECTION_NAME:knowledge_chunk_vectors_test}

deepseek:
  enabled: false

ai:
  judge:
    provider: deepseek
